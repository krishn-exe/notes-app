# 1. HTTP Server: Redirect krishn.tech domain traffic to HTTPS
server {
    listen 80;
    server_name krishn.tech www.krishn.tech;

    # Certbot ACME challenge location (for automated certificate renewals)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTP Server fallback for direct IP and localhost access
server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 20M;

    # Docker internal DNS resolver
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_server http://web:8000;

    # Serve static files directly
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Proxy all other requests to Gunicorn
    location / {
        proxy_pass $backend_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}

# 3. HTTPS Server (krishn.tech & www.krishn.tech)
server {
    listen 443 ssl default_server;
    server_name krishn.tech www.krishn.tech;

    ssl_certificate /etc/letsencrypt/live/krishn.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/krishn.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 20M;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_server http://web:8000;

    # Serve static files directly
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Proxy to Gunicorn
    location / {
        proxy_pass $backend_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
    }
}
